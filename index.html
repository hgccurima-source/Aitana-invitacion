<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preinvitación XV de Aitana • 13 de Febrero</title>

    <!-- Vista previa al compartir por WhatsApp -->
    <meta property="og:title" content="Preinvitación XV de Aitana">
    <meta property="og:description" content="Hay momentos en la vida que se vuelven inolvidables... Reservá esta fecha.">
    <meta property="og:image" content="https://aitana-invitacion.onrender.com/sobre-aitana.png">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fff7fa;
            --bg-pink: #fce8ef;
            --envelope-bg: #f8dce6;
            --pink-dark: #bd7892;
            --pink-deep: #985b76;
            --gold: #bd9650;
            --gold-light: #f2dfb4;
            --gold-dark: #92703b;
            --text-dark: #57434b;
            --text-muted: #8c737d;
            --shadow: rgba(126, 78, 96, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background:
                radial-gradient(circle at 15% 15%, rgba(255,255,255,.95), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(242,223,180,.30), transparent 30%),
                linear-gradient(145deg, #fff9fb, #f9e8ee 55%, #fff8f3);
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(rgba(189,150,80,.55) 1px, transparent 1.5px),
                radial-gradient(rgba(255,255,255,.95) 1px, transparent 1.5px);
            background-size: 47px 47px, 73px 73px;
            background-position: 0 0, 22px 31px;
            opacity: .28;
        }

        .music-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            background: rgba(255,255,255,.72);
            border: 1px solid var(--gold);
            color: var(--gold-dark);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: all .3s ease;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px var(--shadow);
        }

        .music-toggle:hover { background: var(--gold-light); transform: scale(1.05); }
        .music-toggle.playing { animation: pulse-gold 2s infinite; }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(189,150,80,.35); }
            70% { box-shadow: 0 0 0 10px rgba(189,150,80,0); }
            100% { box-shadow: 0 0 0 0 rgba(189,150,80,0); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 28px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        .envelope-wrapper {
            position: relative;
            width: min(340px, 86vw);
            height: 240px;
            cursor: pointer;
            transition: transform .6s ease;
            filter: drop-shadow(0 15px 28px rgba(126,78,96,.22));
        }

        .envelope-wrapper.open { transform: scale(.9); pointer-events: none; }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fbe8ee, #f2cbd9);
            border: 1px solid rgba(189,150,80,.55);
            border-radius: 5px;
            overflow: hidden;
        }

        .envelope::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid #f4d5e0;
            border-right: 170px solid #f4d5e0;
            border-bottom: 130px solid #edc2d1;
            z-index: 3;
        }

        .envelope::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-bottom: 120px solid #f0cad8;
            z-index: 4;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 130px solid #fbe8ee;
            transform-origin: top;
            transition: transform .6s ease .2s;
            z-index: 5;
            filter: drop-shadow(0 2px 2px rgba(189,150,80,.15));
        }

        .envelope-wrapper.open .flap { transform: rotateX(180deg); z-index: 1; }

        .wax-seal {
            position: absolute;
            top: 91px;
            left: 50%;
            transform: translateX(-50%);
            width: 76px;
            height: 76px;
            background: radial-gradient(circle at 35% 28%, #fff1cf 0%, #d9b66f 38%, #ad8441 76%, #8c6835 100%);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(94,65,35,.25), inset 0 2px 5px rgba(255,255,255,.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 6;
            transition: transform .4s ease, opacity .4s ease;
            border: 2px solid rgba(255,248,225,.85);
            outline: 1px dashed rgba(146,112,59,.8);
            outline-offset: -6px;
        }

        .wax-seal span {
            font-family: 'Alex Brush', cursive;
            font-size: 27px;
            color: #fffaf0;
            text-shadow: 0 1px 2px rgba(91,65,34,.45);
        }

        .envelope-wrapper.open .wax-seal {
            transform: translateX(-50%) scale(1.3);
            opacity: 0;
        }

        .envelope-instruction {
            position: absolute;
            bottom: -51px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--gold-dark);
            text-transform: uppercase;
            white-space: nowrap;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-6px); }
            60% { transform: translateX(-50%) translateY(-3px); }
        }

        .letter-card {
            position: absolute;
            width: min(360px, calc(100vw - 36px));
            background:
                radial-gradient(circle at top right, rgba(242,223,180,.18), transparent 35%),
                linear-gradient(145deg, #fffdfb, #fff7f8);
            color: var(--text-dark);
            border-radius: 10px;
            padding: 38px 28px 30px;
            box-shadow: 0 20px 45px rgba(126,78,96,.22);
            opacity: 0;
            transform: translateY(40px) scale(.95);
            pointer-events: none;
            transition: all .8s cubic-bezier(.16,1,.3,1) .5s;
            z-index: 20;
            text-align: center;
            border: 1px solid rgba(189,150,80,.55);
        }

        .letter-card::before {
            content: '';
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(189,150,80,.28);
            border-radius: 6px;
            pointer-events: none;
        }

        .letter-card.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

        .card-header {
            font-family: 'Alex Brush', cursive;
            font-size: 48px;
            line-height: 1.1;
            color: var(--pink-deep);
            margin-bottom: 5px;
        }

        .card-subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 22px;
            font-weight: 600;
        }

        .divider {
            width: 58px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 22px;
        }

        .card-body {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            line-height: 1.5;
            color: #66515a;
            min-height: 120px;
            margin-bottom: 20px;
        }

        .event-details {
            background: rgba(248,220,230,.42);
            border: 1px solid rgba(189,150,80,.42);
            border-radius: 7px;
            padding: 14px 10px;
            margin-bottom: 22px;
        }

        .event-date {
            font-size: 15px;
            font-weight: 600;
            color: var(--pink-deep);
            letter-spacing: 1.1px;
        }

        .btn-calendar {
            display: inline-block;
            background: linear-gradient(135deg, #c9a35e, #a98143);
            color: #fffdf8;
            padding: 12px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: all .3s ease;
            box-shadow: 0 4px 12px rgba(169,129,67,.25);
            border: 1px solid rgba(255,255,255,.65);
            position: relative;
            z-index: 1;
        }

        .btn-calendar:hover {
            background: linear-gradient(135deg, #b88f4e, #92703b);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(169,129,67,.32);
        }

        .replay-hint {
            margin-top: 20px;
            font-size: 11px;
            color: #9a818b;
            cursor: pointer;
            letter-spacing: .7px;
            text-decoration: underline;
            position: relative;
            z-index: 1;
        }

        .replay-hint:hover { color: var(--pink-deep); }

        @media (max-width: 390px) {
            .letter-card { padding: 32px 22px 26px; }
            .card-header { font-size: 43px; }
            .card-body { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <button class="music-toggle" id="musicToggle" title="Activar / Silenciar música" aria-label="Activar o silenciar música" type="button">
        <svg id="musicIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
    </button>

    <div class="container">
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()" role="button" tabindex="0" aria-label="Abrir la preinvitación de Aitana">
            <div class="envelope">
                <div class="flap"></div>
                <div class="wax-seal"><span>Aitana</span></div>
            </div>
            <div class="envelope-instruction">Tocá para abrir</div>
        </div>

        <div class="letter-card" id="letterCard">
            <div class="card-header">Mis XV años</div>
            <div class="card-subtitle">Aitana</div>
            <div class="divider"></div>
            <div class="card-body" id="typingText"></div>

            <div class="event-details">
                <div class="event-date">SÁBADO • 13 • FEBRERO • 2027</div>
            </div>

            <a href="#" id="calendarBtn" class="btn-calendar" onclick="addToCalendar(event)">
                📅 Agregar a mi calendario
            </a>

            <div class="replay-hint" onclick="resetEnvelope()">Volver a cerrar el sobre</div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let melodyInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playMusicBoxNote(freq, time = 0) {
            if (!audioCtx) return;
            setTimeout(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 2.5);
                } catch (e) {}
            }, time);
        }

        function playMelody() {
            initAudio();
            if (isPlaying) return;
            isPlaying = true;
            document.getElementById('musicToggle').classList.add('playing');

            const notes = [
                523.25, 659.25, 783.99, 1046.50,
                880.00, 783.99, 659.25, 523.25,
                587.33, 698.46, 880.00, 1046.50,
                783.99, 659.25, 587.33, 523.25
            ];

            function playSequence() {
                if (!isPlaying) return;
                notes.forEach((note, i) => playMusicBoxNote(note, i * 300));
            }

            playSequence();
            melodyInterval = setInterval(playSequence, 5000);
        }

        function toggleMusic() {
            initAudio();
            const toggleBtn = document.getElementById('musicToggle');
            if (isPlaying) {
                isPlaying = false;
                clearInterval(melodyInterval);
                toggleBtn.classList.remove('playing');
            } else {
                playMelody();
            }
        }

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        function openEnvelope() {
            playMelody();
            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('letterCard');
            wrapper.classList.add('open');
            setTimeout(() => {
                card.classList.add('show');
                startTypingAnimation();
            }, 500);
        }

        const fullText = "Hay momentos en la vida que se vuelven inolvidables cuando se comparten con las personas que queremos. Reservá esta fecha para compartir conmigo una noche muy especial. ¡Próximamente recibirás la invitación formal!";
        let charIndex = 0;

        function startTypingAnimation() {
            const typingTarget = document.getElementById('typingText');
            typingTarget.textContent = "";
            charIndex = 0;

            function type() {
                if (charIndex < fullText.length) {
                    typingTarget.textContent += fullText.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 35);
                }
            }
            type();
        }

        function resetEnvelope() {
            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('letterCard');
            card.classList.remove('show');
            setTimeout(() => wrapper.classList.remove('open'), 300);
        }

        // Agrega el 13/02/2027 como evento de día completo, sin horario ni ubicación.
        function addToCalendar(e) {
            e.preventDefault();

            const title = "XV de Aitana";
            const details = "Reservá esta fecha para celebrar los XV de Aitana. Próximamente recibirás la invitación formal.";

            const googleUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
                + "&text=" + encodeURIComponent(title)
                + "&dates=20270213/20270214"
                + "&details=" + encodeURIComponent(details);

            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                window.open(googleUrl, "_blank", "noopener");
            } else {
                const icsContent = [
                    "BEGIN:VCALENDAR",
                    "VERSION:2.0",
                    "PRODID:-//Preinvitacion Aitana//ES",
                    "CALSCALE:GREGORIAN",
                    "BEGIN:VEVENT",
                    "UID:xv-aitana-20270213@aitana-invitacion",
                    "DTSTAMP:20261116T120000Z",
                    "SUMMARY:" + title,
                    "DESCRIPTION:" + details,
                    "DTSTART;VALUE=DATE:20270213",
                    "DTEND;VALUE=DATE:20270214",
                    "END:VEVENT",
                    "END:VCALENDAR"
                ].join("\r\n");

                const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "XV_Aitana_13_febrero_2027.ics";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        document.getElementById("envelopeWrapper").addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openEnvelope();
            }
        });
    </script>
</body>
</html>
