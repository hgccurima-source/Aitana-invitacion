<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preinvitación XV de Aitana • 12 de Febrero</title>
    
    <!-- Open Graph / WhatsApp Preview Meta Tags -->
    <meta property="og:title" content="Preinvitación XV de Aitana">
    <meta property="og:description" content="Hay momentos en la vida que se vuelven inolvidables... Reservá esta fecha.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f1115;
            --envelope-bg: #f7f4ed;
            --envelope-shadow: rgba(0, 0, 0, 0.4);
            --wax-color: #7b1e2a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-dark: #2c2c2c;
            --text-light: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo con estrellas / polvo dorado sutil */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.08;
        }

        /* Botón de Música Flotante */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .music-toggle:hover {
            background: var(--gold);
            color: var(--bg-color);
            transform: scale(1.05);
        }

        .music-toggle.playing {
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* Contenedor Principal */
        .container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Estructura del Sobre */
        .envelope-wrapper {
            position: relative;
            width: 340px;
            height: 240px;
            cursor: pointer;
            transition: transform 0.6s ease;
            filter: drop-shadow(0 15px 35px var(--envelope-shadow));
        }

        .envelope-wrapper.open {
            transform: scale(0.9);
            pointer-events: none;
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--envelope-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Bolsillo frontal del sobre */
        .envelope::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid #ece4d2;
            border-right: 170px solid #ece4d2;
            border-bottom: 130px solid #e2d8c3;
            z-index: 3;
        }

        .envelope::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-bottom: 120px solid #dfd3bd;
            z-index: 4;
        }

        /* Solapa superior */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 130px solid #f0ece1;
            transform-origin: top;
            transition: transform 0.6s ease 0.2s;
            z-index: 5;
        }

        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* Sello de Lacre */
        .wax-seal {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            background: radial-gradient(circle, #9a2835 0%, var(--wax-color) 70%, #54121a 100%);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 6;
            transition: transform 0.4s ease, opacity 0.4s ease;
            border: 2px dashed rgba(212, 175, 55, 0.4);
        }

        .wax-seal span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            color: var(--gold-light);
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .envelope-wrapper.open .wax-seal {
            transform: translateX(-50%) scale(1.3);
            opacity: 0;
        }

        .envelope-instruction {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
            white-space: nowrap;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-6px); }
            60% { transform: translateX(-50%) translateY(-3px); }
        }

        /* Carta Desplegada */
        .letter-card {
            position: absolute;
            width: 360px;
            background: var(--envelope-bg);
            color: var(--text-dark);
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
            z-index: 20;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .letter-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .card-header {
            font-family: 'Alex Brush', cursive;
            font-size: 42px;
            color: var(--wax-color);
            margin-bottom: 5px;
        }

        .card-subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 25px auto;
        }

        .card-body {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            min-height: 110px;
            margin-bottom: 25px;
        }

        /* Bloque de Fecha y Lugar */
        .event-details {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .event-date {
            font-size: 16px;
            font-weight: 600;
            color: var(--wax-color);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .event-location {
            font-size: 13px;
            color: #555;
            letter-spacing: 0.5px;
        }

        /* Botón de Calendario */
        .btn-calendar {
            display: inline-block;
            background: var(--wax-color);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(123, 30, 42, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .btn-calendar:hover {
            background: #621721;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(123, 30, 42, 0.4);
        }

        .replay-hint {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: underline;
        }

        .replay-hint:hover {
            color: var(--wax-color);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <!-- Botón de Música -->
    <div class="music-toggle" id="musicToggle" title="Activar / Silenciar música">
        <svg id="musicIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
    </div>

    <div class="container">
        <!-- Sobre interactivo -->
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="wax-seal">
                    <span>A</span>
                </div>
            </div>
            <div class="envelope-instruction">Tocá para abrir</div>
        </div>

        <!-- Carta interior -->
        <div class="letter-card" id="letterCard">
            <div class="card-header">Mis 15 Años</div>
            <div class="card-subtitle">Aitana</div>
            <div class="divider"></div>
            <div class="card-body" id="typingText"></div>
            
            <div class="event-details">
                <div class="event-date">12 • FEBRERO • 2027</div>
                <div class="event-location">Club Abastense • Abasto, La Plata</div>
            </div>

            <a href="#" id="calendarBtn" class="btn-calendar" onclick="addToCalendar(event)">
                📅 Agendar en mi Calendario
            </a>

            <div class="replay-hint" onclick="resetEnvelope()">Volver a cerrar sobre</div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let melodyInterval = null;

        // Reproductor de Caja de Música Sintetizada (Web Audio API)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playMusicBoxNote(freq, time = 0) {
            if (!audioCtx) return;
            setTimeout(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 2.5);
                } catch(e) {}
            }, time);
        }

        function playMelody() {
            initAudio();
            if (isPlaying) return;
            isPlaying = true;
            document.getElementById('musicToggle').classList.add('playing');

            // Notas de caja de música (Melodía dulce y sutil)
            const notes = [
                523.25, 659.25, 783.99, 1046.50, // C5, E5, G5, C6
                880.00, 783.99, 659.25, 523.25,
                587.33, 698.46, 880.00, 1046.50,
                783.99, 659.25, 587.33, 523.25
            ];

            let index = 0;
            playSequence();
            melodyInterval = setInterval(playSequence, 5000);

            function playSequence() {
                if (!isPlaying) return;
                notes.forEach((note, i) => {
                    playMusicBoxNote(note, i * 300);
                });
            }
        }

        function toggleMusic() {
            initAudio();
            const toggleBtn = document.getElementById('musicToggle');
            if (isPlaying) {
                isPlaying = false;
                clearInterval(melodyInterval);
                toggleBtn.classList.remove('playing');
            } else {
                playMelody();
            }
        }

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        // Animación de Apertura
        function openEnvelope() {
            playMelody();
            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('letterCard');
            
            wrapper.classList.add('open');
            
            setTimeout(() => {
                card.classList.add('show');
                startTypingAnimation();
            }, 500);
        }

        // Efecto Escritura Mágica
        const fullText = "Hay momentos en la vida que se vuelven inolvidables cuando se comparten con las personas que queremos. Reservá esta fecha, porque quiero vivir una noche mágica junto con vos.";
        let charIndex = 0;

        function startTypingAnimation() {
            const typingTarget = document.getElementById('typingText');
            typingTarget.innerHTML = "";
            charIndex = 0;
            
            function type() {
                if (charIndex < fullText.length) {
                    typingTarget.innerHTML += fullText.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 35);
                }
            }
            type();
        }

        function resetEnvelope() {
            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('letterCard');
            
            card.classList.remove('show');
            setTimeout(() => {
                wrapper.classList.remove('open');
            }, 300);
        }

        // Generar archivo .ics o Google Calendar
        function addToCalendar(e) {
            e.preventDefault();
            const title = "XV de Aitana";
            const details = "Te espero para celebrar mis 15 años. ¡No faltes!";
            const location = "Club Abastense, Abasto, La Plata";
            const startDate = "20270212T210000Z";
            const endDate = "20270213T050000Z";

            // Enlace directo a Google Calendar
            const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDate}/${endDate}&details=${encodeURIComponent(details)}&location=${encodeURIComponent(location)}`;
            
            // Detección simple para abrir Google Calendar o descargar ICS
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                window.open(googleUrl, '_blank');
            } else {
                // Descargar archivo .ics para PC
                const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${title}\nDESCRIPTION:${details}\nLOCATION:${location}\nDTSTART:${startDate}\nDTEND:${endDate}\nEND:VEVENT\nEND:VCALENDAR`;
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute('download', 'XV_Aitana.ics');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
